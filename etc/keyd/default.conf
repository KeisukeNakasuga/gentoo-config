[ids]
*

[main]
# JIS HHKB(Mac モード)の 英数/かな は hanja/hangeul として届く。IME 制御用に 無変換/変換 へ置換
hanja = muhenkan
hangeul = henkan

leftmeta = overload(meta_mac, leftmeta)

[meta_mac:M]
# ⌘C → Ctrl+Insert(コピーの別表現。ghostty でも SIGINT と衝突しない)
c = C-insert
# ⌘V → Shift+Insert(ペースト)
v = S-insert
# ⌘X → カット
x = C-x
# ⌘Z → 取り消し
z = C-z
